[project]
name = "fraud-detection"
version = "0.1.0"
description = "Real-Time Financial Fraud Detection Platform"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.1,<3",
    "numpy>=2.0,<3",
    "scikit-learn==1.6.1",
    "xgboost==2.1.4",
    "mlflow==2.22.5",
    "feast[redis]==0.67.0",
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "confluent-kafka>=2.3,<3",
    "redis>=5.0,<6",
    "psycopg2-binary>=2.9,<3",
    "sqlalchemy==2.0.43",
    "streamlit>=1.30,<2",
    "evidently==0.7.23",
    "torch>=2.2,<3",
    "torch-geometric>=2.5,<3",
    "shap>=0.44,<1",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "requests>=2.31,<3",
    "pyyaml>=6.0,<7",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
    "ruff>=0.3,<1",
    "pytest-cov>=4.1,<6",
    "jupyter>=1.0,<2",
    "notebook>=7.0,<8",
    "ipykernel>=6.27,<7",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
